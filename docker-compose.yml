version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: doh-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LAYER_C_PROVIDER=${LAYER_C_PROVIDER:-gemini}
      - LAYER_C_MODEL=${LAYER_C_MODEL:-gemini-2.5-flash}
      # Production: tarayıcının geldiği frontend origin'ini ekleyin
      # Örn: CORS_ORIGINS=https://my-app.vercel.app
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      # ChromaDB veritabanı kalıcı — ilk başlatmada ingest.py doldurur
      - chromadb_data:/app/data/chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # ingest süresine tolerans

  frontend:
    build:
      context: ./frontend
      args:
        # Tarayıcı bu URL'e istek atar — Docker host'un dış portunu kullanır
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: doh-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chromadb_data:
    driver: local
