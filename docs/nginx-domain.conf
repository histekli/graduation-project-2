# ════════════════════════════════════════════════════════════════════════════
#  Nginx — domain ile production. Host makinede çalışır.
#
#  Frontend  → https://domain.com (+ www.domain.com)   → container 127.0.0.1:3000
#  Backend   → https://api.domain.com                  → container 127.0.0.1:8000
#
#  Kurulum:
#    1) DNS: domain.com, www.domain.com, api.domain.com için A kaydını
#       Droplet IP'sine yönlendirin.
#    2) Bu dosyadaki "domain.com" yerlerini kendi domaininizle değiştirin.
#    3) sudo cp docs/nginx-domain.conf /etc/nginx/sites-available/doh
#       sudo ln -s /etc/nginx/sites-available/doh /etc/nginx/sites-enabled/doh
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#    4) SSL (HTTPS) — Certbot 443 sunucu bloklarını ve yönlendirmeyi OTOMATİK ekler:
#         sudo apt install -y certbot python3-certbot-nginx
#         sudo certbot --nginx -d domain.com -d www.domain.com -d api.domain.com
#
#  Bu kurulumda:
#    frontend  NEXT_PUBLIC_API_URL=https://api.domain.com
#    backend   CORS_ORIGINS=https://domain.com,https://www.domain.com
# ════════════════════════════════════════════════════════════════════════════

# ── Frontend: domain.com + www.domain.com ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name domain.com www.domain.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # Next.js WebSocket/HMR
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Backend API: api.domain.com ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.domain.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;             # backend kök yollarına (/health, /analyze)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # uzun süren LLM analizleri için
    }
}
