# ════════════════════════════════════════════════════════════════════════════
#  Nginx — IP ile yayın (domain yokken). Host makinede çalışır.
#
#  Kurulum:
#    sudo cp docs/nginx-ip.conf /etc/nginx/sites-available/doh
#    sudo ln -s /etc/nginx/sites-available/doh /etc/nginx/sites-enabled/doh
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Frontend  → http://SERVER_IP/         (Next.js, container 127.0.0.1:3000)
#  Backend   → http://SERVER_IP/api/     (FastAPI, container 127.0.0.1:8000)
#  Health    → http://SERVER_IP/api/health
#
#  Bu kurulumda frontend NEXT_PUBLIC_API_URL=http://SERVER_IP/api olmalıdır.
# ════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name _;              # tüm host adlarına / IP'ye yanıt verir

    client_max_body_size 20M;   # .docx yüklemeleri için (varsayılan 1M'i aşar)

    # ── Backend API ──────────────────────────────────────────────────────────
    # Sondaki "/" sayesinde /api/ ön eki backend'e iletilirken KALDIRILIR:
    #   /api/health   →  http://127.0.0.1:8000/health
    #   /api/analyze  →  http://127.0.0.1:8000/analyze
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # uzun süren LLM analizleri için
    }

    # ── Frontend ── geri kalan tüm istekler Next.js'e
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # Next.js WebSocket/HMR
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
